<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>qavanin AlfaCyB</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: Tahoma, Arial, sans-serif;
            min-height: 100vh;
        }

        .container {
            width: 92%;
            max-width: 620px;
            margin: auto;
            padding: 25px 0 40px;
            text-align: center;
        }

        h1 {
            font-size: 42px;
            margin: 0 0 25px;
            font-weight: bold;
        }

        .subtitle {
            font-size: 24px;
            color: #ccc;
            margin-bottom: 90px;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .main-button {
            width: 100%;
            padding: 28px 20px;
            border: 2px solid #ff0000;
            border-radius: 22px;
            background: #111;
            color: #fff;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .main-button:hover {
            background: #180000;
            box-shadow: 0 0 18px #ff0000;
        }

        .sub-menu {
            display: none;
            flex-direction: column;
            gap: 14px;
            margin-top: -8px;
        }

        .sub-button {
            display: block;
            width: 90%;
            margin: auto;
            padding: 20px;
            border: 2px solid #ff0000;
            border-radius: 18px;
            background: #0d0d0d;
            color: #fff;
            text-decoration: none;
            font-size: 23px;
            font-weight: bold;
            transition: 0.2s;
        }

        .sub-button:hover {
            background: #180000;
            box-shadow: 0 0 15px #ff0000;
        }

        .checker {
            width: 100%;
            padding: 28px;
            border: 2px solid #ff0000;
            border-radius: 22px;
            background: #111;
            text-align: right;
        }

        .checker-title {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .line {
            border-top: 1px solid #444;
            margin-bottom: 25px;
        }

        .checker p {
            font-size: 20px;
            margin: 18px 0;
        }

        .footer {
            margin-top: 70px;
            color: #777;
            font-size: 18px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>qavanin AlfaCyB</h1>

    <div class="subtitle">
        Sazandeh Website | MaHzIaR ALFA CyB
    </div>

    <div class="menu">

        <!-- قوانین AlfaCyB -->
        <button class="main-button" onclick="toggleRules()">
            qavanin AlfaCyB
        </button>

        <!-- دکمه‌های داخلی قوانین -->
        <div class="sub-menu" id="rulesMenu">

            <a href="typering.html" class="sub-button">
                تایپرینگ
            </a>

            <a href="cybering.html" class="sub-button">
                سایبرینگ
            </a>

        </div>

        <!-- درباره سایت -->
        <button class="main-button">
            درباره سایت
        </button>

        <!-- Checker -->
        <div class="checker">

            <div class="checker-title">
                checker AlfaCyB
            </div>

            <div class="line"></div>

            <p>Creator : MaHzIaR ALFA CyB</p>
            <p>Owner all : MMD NiKlavs</p>
            <p>checker : khodayegan</p>
            <p>checker : Reza Manji</p>
            <p>checker : Ali Mossad</p>
            <p>checker : MMD HooK</p>
            <p>checker : Pasha AZKABAN</p>

        </div>

    </div><div class="footer">
        qavanin AlfaCyB 2026 ©
    </div>

</div>

<script>
    function toggleRules() {
        const menu = document.getElementById("rulesMenu");

        if (menu.style.display === "flex") {
            menu.style.display = "none";
        } else {
            menu.style.display = "flex";
        }
    }
</script>

</body>
</html>
