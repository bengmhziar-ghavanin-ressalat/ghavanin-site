<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>قوانین رسالت</title>

    <style>
        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #111;
            color: white;
        }

        header {
            background: #000;
            padding: 30px;
            text-align: center;
            border-bottom: 2px solid white;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            color: #ccc;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .box {
            background: #1b1b1b;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 12px;
            border: 1px solid #333;
        }

        .box h2 {
            margin-top: 0;
        }

        button {
            background: white;
            color: black;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #ccc;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #888;
            border-top: 1px solid #333;
        }
    </style>
</head>

<body>

<header>
    <h1>قوانین رسالت</h1>
    <p>مرجع ساده و منظم برای مطالعه قوانین</p>
</header>

<div class="container">

    <div class="box">
        <h2>📜 قوانین رسالت</h2>

        <p>
            در این بخش قوانین و مقررات مربوط به رسالت
            به صورت منظم قرار می‌گیرند.
        </p>

        <button onclick="showMessage()">
            مشاهده قوانین
        </button>
    </div>

    <div class="box">
        <h2>ℹ️ درباره سایت</h2>

        <p>
            هدف این سایت ارائه اطلاعات قوانین
            به شکلی ساده و قابل دسترس است.
        </p>
    </div>

</div>

<footer>
    © 2026 قوانین رسالت
</footer>

<script>
    function showMessage() {
        alert("بخش قوانین به‌زودی اضافه می‌شود.");
    }
</script>

</body>
</html>
